[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fraudgnn"
version = "0.1.0"
description = "Real-Time Fraud Detection with Graph Neural Networks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ML Engineer" }]
keywords = ["fraud-detection", "gnn", "graph-neural-networks", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "mlflow>=2.8",
    "evidently>=0.4",
]
serve = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "redis>=5.0",
    "confluent-kafka>=2.3",
    "prometheus-client>=0.19",
    "streamlit>=1.28",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
    "types-PyYAML>=6.0",
    "types-redis>=4.6",
    "pandas-stubs>=2.0",
    "matplotlib>=3.8",
]
all = ["fraudgnn[train,serve,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src/fraudgnn"]

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI)
    "TC",     # flake8-type-checking (causes issues with runtime Pydantic models)
]

[tool.ruff.lint.isort]
known-first-party = ["fraudgnn"]

# ── Mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ── Pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
